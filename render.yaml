services:
  - type: web
    name: cliprd-live-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: cliprd-persistent-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIPRD_DATA_DIR
        value: /var/data
      - key: CLIPRD_PYTHON
        value: /opt/venv/bin/python
      - key: PORT
        value: "3847"
